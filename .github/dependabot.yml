version: 2
updates:
  # Keep GitHub Actions in workflows up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"

  # Uncomment the ecosystems that match your project.

  # Python (requirements.txt, pyproject.toml)
  # - package-ecosystem: "pip"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  #   commit-message:
  #     prefix: "deps"

  # C/C++ projects using CMake or vcpkg have no native Dependabot ecosystem;
  # add entries here if you use a package manager that Dependabot supports.
